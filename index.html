<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥仔提成计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .row-group {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .input-with-unit {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-unit input {
            padding-right: 28px;
        }

        .input-with-unit .unit {
            position: absolute;
            right: 10px;
            color: #a0aec0;
            font-size: 14px;
            pointer-events: none;
        }

        .result-box {
            background-color: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
            border: 1px solid #edf2f7;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
            color: #4a5568;
        }

        .result-item.total {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 2px dashed #cbd5e0;
            font-size: 18px;
            font-weight: bold;
            color: #2b6cb0;
        }

        .amount {
            font-family: "Courier New", Courier, monospace;
            font-weight: 600;
        }

        .total .amount {
            color: #e53e3e;
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>💰 肥仔提成计算器</h2>

    <!-- 中美汇率 -->
    <div class="input-group">
        <label for="exchangeRate">中美汇率 (USD/CNY)</label>
        <input type="number" id="exchangeRate" step="0.0001" placeholder="例如: 7.23" oninput="calculate()">
    </div>

    <!-- 肥仔个人销售额及比例 -->
    <div class="input-group">
        <div class="row-group">
            <div>
                <label for="personalSales">肥仔个人销售额 ($)</label>
                <input type="number" id="personalSales" step="1" placeholder="请输入金额" oninput="calculate()">
            </div>
            <div>
                <label for="personalRate">提成比例 (%)</label>
                <div class="input-with-unit">
                    <input type="number" id="personalRate" step="0.1" value="2.3" placeholder="2.3" oninput="calculate()">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 团队销售额及比例 -->
    <div class="input-group">
        <div class="row-group">
            <div>
                <label for="teamSales">手下团队销售额 ($)</label>
                <input type="number" id="teamSales" step="1" placeholder="请输入金额" oninput="calculate()">
            </div>
            <div>
                <label for="teamRate">提成比例 (%)</label>
                <div class="input-with-unit">
                    <input type="number" id="teamRate" step="0.1" value="1.0" placeholder="1.0" oninput="calculate()">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 计算结果展示区 -->
    <div class="result-box">
        <div class="result-item">
            <span id="labelPersonal">个人提成 (2.3%):</span>
            <span class="amount" id="personalCommission">¥ 0.00</span>
        </div>
        <div class="result-item">
            <span id="labelTeam">团队提成 (1.0%):</span>
            <span class="amount" id="teamCommission">¥ 0.00</span>
        </div>
        <div class="result-item total">
            <span>总提成金额:</span>
            <span class="amount" id="totalCommission">¥ 0.00</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // 获取汇率与销售额
        const exchangeRate = parseFloat(document.getElementById('exchangeRate').value) || 0;
        const personalSales = parseFloat(document.getElementById('personalSales').value) || 0;
        const personalRate = parseFloat(document.getElementById('personalRate').value) || 0;

        const teamSales = parseFloat(document.getElementById('teamSales').value) || 0;
        const teamRate = parseFloat(document.getElementById('teamRate').value) || 0;

        // 计算提成
        const personalComm = personalSales * exchangeRate * (personalRate / 100);
        const teamComm = teamSales * exchangeRate * (teamRate / 100);
        const totalComm = personalComm + teamComm;

        // 动态更新下方文字中的百分比提示
        document.getElementById('labelPersonal').innerText = `个人提成 (${personalRate}%):`;
        document.getElementById('labelTeam').innerText = `团队提成 (${teamRate}%):`;

        // 渲染格式化金额
        document.getElementById('personalCommission').innerText = '¥ ' + personalComm.toFixed(2);
        document.getElementById('teamCommission').innerText = '¥ ' + teamComm.toFixed(2);
        document.getElementById('totalCommission').innerText = '¥ ' + totalComm.toFixed(2);
    }

    // 页面加载后自动运行一次初始化
    calculate();
</script>

</body>
</html>
