<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥仔提成计算器 (团队1%固定版)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .calculator-card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 12px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .rule-badge {
            background: #ebf8ff;
            border: 1px solid #3182ce;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2b6cb0;
            line-height: 1.5;
        }

        .rule-badge strong {
            color: #2c5282;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
            background-color: #fff;
        }

        input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .result-box {
            background-color: #f7fafc;
            border-radius: 12px;
            padding: 18px;
            margin-top: 20px;
            border: 1px solid #edf2f7;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e2e8f0;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4a5568;
        }

        .result-detail {
            font-size: 12px;
            color: #718096;
            margin-bottom: 12px;
            padding-left: 8px;
            border-left: 2px solid #cbd5e0;
            line-height: 1.4;
        }

        .amount {
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            color: #2d3748;
        }

        .amount.highlight {
            color: #d69e2e;
        }

        .total-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed #cbd5e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-box span {
            font-size: 16px;
            font-weight: 700;
            color: #1a202c;
        }

        .total-box .total-amount {
            font-size: 22px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 800;
            color: #e53e3e;
        }

        .btn-copy {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background-color: #2b6cb0;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>💰 肥仔提成计算器</h2>

    <div class="rule-badge">
        <strong>最新提成规则：</strong><br>
        • <strong>个人提成（阶梯）</strong>：10万RMB以内按 <strong>2.5%</strong> | 超出10万RMB部分按 <strong>2.7%</strong><br>
        • <strong>团队提成（固定）</strong>：固定按 <strong>1.0%</strong> 计算
    </div>

    <!-- 中美汇率 -->
    <div class="input-group">
        <label for="exchangeRate">中美汇率 (USD / CNY)</label>
        <input type="number" id="exchangeRate" step="0.0001" placeholder="例如: 7.23" oninput="calculate()">
    </div>

    <!-- 肥仔个人销售额 -->
    <div class="input-group">
        <label for="personalSales">肥仔个人销售额 ($ USD)</label>
        <input type="number" id="personalSales" step="1" placeholder="请输入美元销售额" oninput="calculate()">
    </div>

    <!-- 团队销售额 -->
    <div class="input-group">
        <label for="teamSales">手下团队销售额 ($ USD)</label>
        <input type="number" id="teamSales" step="1" placeholder="请输入美元销售额" oninput="calculate()">
    </div>

    <!-- 计算结果展示区 -->
    <div class="result-box">
        <!-- 个人计算明细 -->
        <div class="section-title">👤 肥仔个人提成明细 (阶梯)</div>
        <div class="result-row">
            <span>折合人民币销售额:</span>
            <span class="amount" id="personalRmb">¥ 0.00</span>
        </div>
        <div class="result-detail" id="personalDetail">
            10万内(2.5%): ¥ 0.00 | 超出(2.7%): ¥ 0.00
        </div>
        <div class="result-row">
            <span>个人提成小计:</span>
            <span class="amount highlight" id="personalComm">¥ 0.00</span>
        </div>

        <!-- 团队计算明细 -->
        <div class="section-title" style="margin-top: 14px;">👥 团队提成明细 (固定1%)</div>
        <div class="result-row">
            <span>折合人民币销售额:</span>
            <span class="amount" id="teamRmb">¥ 0.00</span>
        </div>
        <div class="result-detail" id="teamDetail">
            固定提成率: 1.0%
        </div>
        <div class="result-row">
            <span>团队提成小计:</span>
            <span class="amount highlight" id="teamComm">¥ 0.00</span>
        </div>

        <!-- 总计 -->
        <div class="total-box">
            <span>总计应得提成:</span>
            <span class="total-amount" id="totalComm">¥ 0.00</span>
        </div>
    </div>

    <button class="btn-copy" onclick="copyResults()">📋 复制计算汇总文本</button>
</div>

<div class="toast" id="toast">已复制计算结果到剪贴板</div>

<script>
    // 肥仔个人阶梯提成计算函数
    function calcPersonalTiered(salesRmb) {
        if (salesRmb <= 0) {
            return { base: 0, extra: 0, total: 0 };
        }
        if (salesRmb <= 100000) {
            const total = salesRmb * 0.025;
            return { base: total, extra: 0, total: total };
        } else {
            const base = 100000 * 0.025; // 前10万按2.5% = 2500元
            const extra = (salesRmb - 100000) * 0.027; // 超出部分按2.7%
            return { base: base, extra: extra, total: base + extra };
        }
    }

    // 团队固定1%提成计算函数
    function calcTeamFixed(salesRmb) {
        if (salesRmb <= 0) return 0;
        return salesRmb * 0.01; // 固定 1%
    }

    function calculate() {
        const rate = parseFloat(document.getElementById('exchangeRate').value) || 0;
        const personalUsd = parseFloat(document.getElementById('personalSales').value) || 0;
        const teamUsd = parseFloat(document.getElementById('teamSales').value) || 0;

        // 折算人民币
        const personalRmb = personalUsd * rate;
        const teamRmb = teamUsd * rate;

        // 计算各项提成
        const personalRes = calcPersonalTiered(personalRmb);
        const teamComm = calcTeamFixed(teamRmb);
        const totalComm = personalRes.total + teamComm;

        // 更新界面 - 个人
        document.getElementById('personalRmb').innerText = '¥ ' + personalRmb.toFixed(2);
        document.getElementById('personalDetail').innerText = 
            `10万内(2.5%): ¥ ${personalRes.base.toFixed(2)} | 超出(2.7%): ¥ ${personalRes.extra.toFixed(2)}`;
        document.getElementById('personalComm').innerText = '¥ ' + personalRes.total.toFixed(2);

        // 更新界面 - 团队
        document.getElementById('teamRmb').innerText = '¥ ' + teamRmb.toFixed(2);
        document.getElementById('teamDetail').innerText = 
            `固定提成率: 1.0% | 计算金额: ¥ ${teamComm.toFixed(2)}`;
        document.getElementById('teamComm').innerText = '¥ ' + teamComm.toFixed(2);

        // 更新界面 - 总计
        document.getElementById('totalComm').innerText = '¥ ' + totalComm.toFixed(2);
    }

    function copyResults() {
        const rate = document.getElementById('exchangeRate').value || '0';
        const personalRmb = document.getElementById('personalRmb').innerText;
        const personalComm = document.getElementById('personalComm').innerText;
        const teamRmb = document.getElementById('teamRmb').innerText;
        const teamComm = document.getElementById('teamComm').innerText;
        const totalComm = document.getElementById('totalComm').innerText;

        const text = `【肥仔提成结算单】\n` +
            `中美汇率: ${rate}\n` +
            `-------------------\n` +
            `个人销售额(RMB): ${personalRmb}\n` +
            `个人提成 (阶梯): ${personalComm}\n` +
            `-------------------\n` +
            `团队销售额(RMB): ${teamRmb}\n` +
            `团队提成 (固定1%): ${teamComm}\n` +
            `===================\n` +
            `总计提成: ${totalComm}`;

        navigator.clipboard.writeText(text).then(() => {
            showToast('已复制计算结果到剪贴板');
        }).catch(() => {
            showToast('复制失败，请手动截图或复制');
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2000);
    }

    // 初始化计算
    calculate();
</script>

</body>
</html>
