<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肥仔三阶梯提成计算器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .calculator-card { background: #ffffff; width: 100%; max-width: 520px; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
        .rule-badge { background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568; font-size: 14px; }
        input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15); }
        .result-box { background-color: #f7fafc; border-radius: 12px; padding: 18px; margin-top: 20px; border: 1px solid #edf2f7; }
        .result-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: #4a5568; }
        .sub-item { font-size: 12px; color: #718096; padding-left: 12px; }
        .result-item.total { margin-top: 8px; margin-bottom: 0; padding-top: 12px; border-top: 2px dashed #cbd5e0; font-size: 16px; font-weight: bold; color: #2b6cb0; }
        .amount { font-family: monospace; font-weight: 600; }
        .total .amount { color: #e53e3e; font-size: 20px; }
        .btn-copy { width: 100%; margin-top: 16px; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-copy:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>💰 肥仔阶梯提成计算器</h2>

    <div class="rule-badge">
        <strong>📋 提成计算规则：</strong><br>
        • 个人提成（RMB）：≤10万 (2.3%) | 10万~30万 (2.5%) | >30万 (2.7%)<br>
        • 团队提成（RMB）：固定 1.0%
    </div>

    <div class="input-group">
        <label for="exchangeRate">中美汇率 (USD / CNY)</label>
        <input type="number" id="exchangeRate" step="0.0001" placeholder="例如: 7.23" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="personalSales">肥仔个人销售额 ($ USD)</label>
        <input type="number" id="personalSales" step="1" placeholder="请输入美元金额" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="teamSales">手下团队销售额 ($ USD)</label>
        <input type="number" id="teamSales" step="1" placeholder="请输入美元金额" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-item">
            <span>个人折合人民币销售额:</span>
            <span class="amount" id="personalRmb">¥ 0.00</span>
        </div>
        <div class="result-item sub-item">
            <span>└ 0 ~ 10万部分 (2.3%):</span>
            <span class="amount" id="tier1Comm">¥ 0.00</span>
        </div>
        <div class="result-item sub-item">
            <span>└ 10万 ~ 30万部分 (2.5%):</span>
            <span class="amount" id="tier2Comm">¥ 0.00</span>
        </div>
        <div class="result-item sub-item">
            <span>└ 超过 30万部分 (2.7%):</span>
            <span class="amount" id="tier3Comm">¥ 0.00</span>
        </div>
        <div class="result-item" style="margin-top: 8px;">
            <span>个人提成小计:</span>
            <span class="amount" id="personalCommTotal">¥ 0.00</span>
        </div>

        <hr style="border: none; border-top: 1px dashed #e2e8f0; margin: 10px 0;">

        <div class="result-item">
            <span>团队折合人民币销售额:</span>
            <span class="amount" id="teamRmb">¥ 0.00</span>
        </div>
        <div class="result-item">
            <span>团队提成小计 (1.0%):</span>
            <span class="amount" id="teamComm">¥ 0.00</span>
        </div>

        <div class="result-item total">
            <span>总提成金额:</span>
            <span class="amount" id="totalComm">¥ 0.00</span>
        </div>
    </div>

    <button class="btn-copy" onclick="copyResult()">📋 复制计算结果汇总</button>
</div>

<script>
    function calculate() {
        const rate = parseFloat(document.getElementById('exchangeRate').value) || 0;
        const personalUsd = parseFloat(document.getElementById('personalSales').value) || 0;
        const teamUsd = parseFloat(document.getElementById('teamSales').value) || 0;

        const personalRmb = personalUsd * rate;
        const teamRmb = teamUsd * rate;

        let t1 = 0, t2 = 0, t3 = 0;

        if (personalRmb > 0) {
            if (personalRmb <= 100000) {
                t1 = personalRmb * 0.023;
            } else if (personalRmb <= 300000) {
                t1 = 100000 * 0.023;
                t2 = (personalRmb - 100000) * 0.025;
            } else {
                t1 = 100000 * 0.023;
                t2 = 200000 * 0.025;
                t3 = (personalRmb - 300000) * 0.027;
            }
        }

        const personalTotal = t1 + t2 + t3;
        const teamTotal = teamRmb * 0.01;
        const grandTotal = personalTotal + teamTotal;

        document.getElementById('personalRmb').innerText = '¥ ' + personalRmb.toFixed(2);
        document.getElementById('tier1Comm').innerText = '¥ ' + t1.toFixed(2);
        document.getElementById('tier2Comm').innerText = '¥ ' + t2.toFixed(2);
        document.getElementById('tier3Comm').innerText = '¥ ' + t3.toFixed(2);
        document.getElementById('personalCommTotal').innerText = '¥ ' + personalTotal.toFixed(2);

        document.getElementById('teamRmb').innerText = '¥ ' + teamRmb.toFixed(2);
        document.getElementById('teamComm').innerText = '¥ ' + teamTotal.toFixed(2);
        document.getElementById('totalComm').innerText = '¥ ' + grandTotal.toFixed(2);
    }

    function copyResult() {
        const rate = document.getElementById('exchangeRate').value || '0';
        const pUsd = document.getElementById('personalSales').value || '0';
        const tUsd = document.getElementById('teamSales').value || '0';
        
        const pRmb = document.getElementById('personalRmb').innerText;
        const pComm = document.getElementById('personalCommTotal').innerText;
        const tRmb = document.getElementById('teamRmb').innerText;
        const tComm = document.getElementById('teamComm').innerText;
        const total = document.getElementById('totalComm').innerText;

        const text = `【肥仔提成计算汇总】\n` +
                     `• 中美汇率: ${rate}\n` +
                     `• 个人销售: $${pUsd} (折合 ${pRmb})\n` +
                     `  └ 个人提成: ${pComm}\n` +
                     `• 团队销售: $${tUsd} (折合 ${tRmb})\n` +
                     `  └ 团队提成(1%): ${tComm}\n` +
                     `----------------------\n` +
                     `💰 应发总提成: ${total}`;

        navigator.clipboard.writeText(text).then(() => {
            alert('计算结果已复制到剪贴板！');
        }).catch(() => {
            alert('复制失败，请手动选择复制');
        });
    }
</script>

</body>
</html>
